# CI for the `nowtempmail` npm package.
#
# Every third-party action is pinned to a full commit SHA. A floating tag like
# `@v4` is a mutable pointer in someone else's repository: whoever can move that
# tag can run arbitrary code with this workflow's token. The `# vX.Y.Z` comment
# beside each SHA is what makes the pin readable and reviewable, and Dependabot
# (see `.github/dependabot.yml`) proposes updates to both together. Note that
# this repository is a release mirror, so such a bump has to be back-ported
# upstream to survive the next release sync — CONTRIBUTING.md explains why.
#
# The test suite makes no network calls (see CONTRIBUTING.md — stub `fetch`, or
# use the shared mock server at `test/helpers/mock-api.ts`), so nothing here
# needs an API key or a secret.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default. Nothing in CI writes to the repository, and a token that
# cannot write cannot be turned into a commit by a compromised dependency.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `ci` not `install`: the lockfile is the input, and a resolution that
      # drifts between runs is a resolution nobody reviewed.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # publint + attw: catches a broken `exports` map, a CJS build that claims
      # to be ESM, and type declarations that resolve under `node16` but not
      # `bundler`. All three are invisible until a consumer hits them.
      - name: Lint package
        run: npm run lint:package

      - name: Size budget
        run: npm run size
